<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e27">
    <link rel="manifest" href="/manifest.json">
    <title>🚀 Rocketman Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }

        body {
            background: #0a0e27;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
        }

        canvas#c {
            width: min(480px, 100vw, calc(100dvh * 2 / 3));
            height: auto;
        }

        canvas {
            display: block;
            max-width: 100vw;
            max-height: 100dvh;
            border-radius: 10px;
            box-shadow: 0 0 60px rgba(255, 107, 53, 0.4);
            outline: none;
            cursor: pointer;
        }

        @media (pointer: coarse) {
            canvas#c {
                border-radius: 0;
                box-shadow: none;
                width: 100vw;
                height: 100dvh;
            }
        }

        #nameOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(4px);
        }

        .name-box {
            background: linear-gradient(160deg, #0d1b4b 0%, #1a0a3a 100%);
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 24px;
            padding: 36px 32px;
            text-align: center;
            width: min(380px, 90vw);
            box-shadow: 0 0 60px rgba(255, 107, 53, 0.35), inset 0 0 30px rgba(0, 0, 0, 0.4);
            font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .name-box.is-record {
            border-color: rgba(255, 215, 0, 0.85);
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.55), inset 0 0 30px rgba(0, 0, 0, 0.4);
        }

        .name-box.no-record {
            border-color: rgba(100, 140, 255, 0.4);
            box-shadow: 0 0 40px rgba(80, 100, 200, 0.3), inset 0 0 30px rgba(0, 0, 0, 0.4);
        }

        .name-trophy {
            font-size: 52px;
            line-height: 1.1;
            margin-bottom: 6px;
        }

        .name-title {
            color: #FFD700;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
            margin-bottom: 4px;
        }

        .name-score-num {
            color: #fff;
            font-size: 46px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 150, 0, 0.5);
            line-height: 1.1;
        }

        .name-score-lbl {
            color: #8090c0;
            font-size: 13px;
            margin-bottom: 22px;
        }

        .name-prompt {
            color: #a0c4ff;
            font-size: 13px;
            margin-bottom: 8px;
        }

        #nameInput {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 215, 0, 0.35);
            border-radius: 14px;
            color: #FFD700;
            font-size: 24px;
            font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
            font-weight: bold;
            text-align: center;
            padding: 12px 16px;
            letter-spacing: 3px;
            outline: none;
            box-sizing: border-box;
            text-transform: uppercase;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #nameInput:focus {
            border-color: rgba(255, 215, 0, 0.85);
            box-shadow: 0 0 22px rgba(255, 215, 0, 0.3);
        }

        #nameInput::placeholder {
            color: rgba(255, 215, 0, 0.22);
            letter-spacing: 2px;
        }

        #nameConfirmBtn {
            margin-top: 18px;
            width: 100%;
            background: linear-gradient(135deg, #ff9c00, #ff6b35);
            border: none;
            border-radius: 30px;
            color: #fff;
            font-size: 18px;
            font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
            font-weight: bold;
            padding: 14px 0;
            cursor: pointer;
            box-shadow: 0 0 24px rgba(255, 107, 53, 0.5);
            transition: transform 0.1s, box-shadow 0.1s;
            letter-spacing: 1px;
        }

        #nameConfirmBtn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 32px rgba(255, 107, 53, 0.7);
        }

        #nameConfirmBtn:active {
            transform: scale(0.97);
        }
    </style>
</head>

        const TALEN = ['nl', 'en'];
        function kiesTaal() {
            try { const s = localStorage.getItem('rocketAdv.lang'); if (TALEN.includes(s)) return s; } catch (e) { }
            const voorkeur = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
            for (const l of voorkeur) { const c = String(l).slice(0, 2).toLowerCase(); if (TALEN.includes(c)) return c; }
            return 'en';
        }
        let taal = kiesTaal();
        function TX(k, v) {
            let s = TEKSTEN[taal][k] ?? TEKSTEN.nl[k] ?? k;
            if (v) for (const n in v) s = s.split('{' + n + '}').join(v[n]);
            return s;
        }
        function zetHtmlTaal() {
            document.documentElement.lang = taal;
            document.getElementById('nameScoreLbl').textContent = TX('punten');
            document.getElementById('namePrompt').textContent = TX('naam.vraag');
            document.getElementById('nameInput').placeholder = TX('naam.veld');
            document.getElementById('nameConfirmBtn').innerHTML = TX('naam.knop') + ' &nbsp;🚀';
        }
        function wisselTaal() {
            taal = TALEN[(TALEN.indexOf(taal) + 1) % TALEN.length];
            try { localStorage.setItem('rocketAdv.lang', taal); } catch (e) { }
            zetHtmlTaal();
        }
        zetHtmlTaal();
        function pasTekst(text, x, y, maxW) {
            const f = ctx.font, m = f.match(/(\d+(?:\.\d+)?)px/);
            if (m) {
                let px = parseFloat(m[1]);
                while (px > 7 && ctx.measureText(text).width > maxW) { px -= 0.5; ctx.font = f.replace(m[0], px + 'px'); }

        // Pakzone voor munten: een staaf langs de lengteas met overal dezelfde breedte (vinnen inbegrepen).
        // De punt van de raket pakt daardoor niet verder dan de zijkant
        const PAK_BREEDTE = 16, PAK_VOOR = 31, PAK_ACHTER = -40;
        function raketPakt(cx, cy, r) {
            const p = raketPose(), s = p.h / 100, a = p.a * Math.PI / 180;

            const sdx = cx - SOUND_BTN.x, sdy = cy - SOUND_BTN.y;
            if (sdx * sdx + sdy * sdy < SOUND_BTN.r * SOUND_BTN.r) {
                soundEnabled = !soundEnabled;
                if (soundEnabled) initAudio().then(() => setMusicActive(true));
                else setMusicActive(false);
                return;
            }
            if (gameMode === 'menu') {
                const tdx = cx - TAAL_BTN.x, tdy = cy - TAAL_BTN.y;
                if (tdx * tdx + tdy * tdy < TAAL_BTN.r * TAAL_BTN.r) { wisselTaal(); return; }
                const tab = hoofdstukTabOnder(cx, cy);
                if (tab) { menuHoofdstuk = tab; menuHoverCard = 0; return; }
                const kaart = kaartOnder(cx, cy);
                if (kaart && (isUnlocked(kaart) || devUnlocked)) { selectLevel(kaart, devUnlocked); return; }
                // Big play button → start level intro
                if (cx > W / 2 - 120 && cx < W / 2 + 120 && cy > H - 75 && cy < H - 10) {
                    selectLevel(levelsVan(menuHoofdstuk).map(l => l.id).filter(isUnlocked).pop() || LEVELS[0].id);
                    return;
                }
                if (!isMobile) {
                    // Dev unlock toggle (bottom left)
                    if (cx > 10 && cx < 105 && cy > H - 28 && cy < H - 10) {
                        devUnlocked = !devUnlocked; return;
                    }
                    // Reset progress button
                    if (cx > W - 110 && cx < W && cy > H - 30 && cy < H) {
                        if (confirm(TX('menu.resetVraag'))) {
                            localStorage.removeItem('rocketAdv.progress');
                            localStorage.removeItem('rocketAdv.lb');
                            location.reload();
                        }
                    }
                }
                return;
            }
            if (gameMode === 'levelIntro') {
                // STARTEN knop
                if (cx > W / 2 - 115 && cx < W / 2 + 115 && cy > H - 112 && cy < H - 62) {
                    startLevel(currentLevelId); return;
                }
                // Terug naar menu knop
                if (cx > W / 2 - 105 && cx < W / 2 + 105 && cy > H - 52 && cy < H - 10) {
                    gameMode = 'menu'; return;
                }
                return;
            }
            if (gameMode === 'gameOver') {
                if (cx > W / 2 - 115 && cx < W / 2 + 115 && cy > H - 115 && cy < H - 63) startLevel(currentLevelId);
                if (cx > W / 2 - 105 && cx < W / 2 + 105 && cy > H - 55 && cy < H - 17) { gameMode = 'menu'; setMusicActive(false); setTimeout(() => setMusicActive(true), 100); }

                    const stap = Math.floor(cutsceneTimer / (60 / d.fps)) % d.frames;
                    const fi = d.frameLijst ? d.frameLijst[stap] : stap;
                    const cfg = ANIM_CONFIGS[d.sprite];
                    if (cfg && cfg.cols) {
                        // Bereken werkelijke src-afmetingen per frame (zelfde als tester)
                        const fw = Math.floor(img.naturalWidth / cfg.cols);
                        const fh = Math.floor(img.naturalHeight / cfg.rows);
                        const off = (cfg.frameOffsets && cfg.frameOffsets[fi]) || { L: 0, R: 0, Y: 0 };
                        const srcW = fw - cfg.padL - cfg.padR - off.L - off.R;
                        const srcH = fh - off.Y;
                        const maxW = 200, maxH = 230;
                        const ratio = Math.min(maxW / srcW, maxH / srcH);

                        drawAnimFrame(d.sprite, fi, -dw / 2, -dh / 2, dw, dh);

                        const col = fi % d.cols;
                        const row = Math.floor(fi / d.cols);

                        const sh = img.naturalHeight / d.rows;

                        ctx.drawImage(img, col * sw, row * sh, sw, sh, -(sw * ratio) / 2, -(sh * ratio) / 2, sw * ratio, sh * ratio);

                    const maxW = 210, maxH = 220;
                    const ratio = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight);
                    const dw = img.naturalWidth * ratio;
                    const dh = img.naturalHeight * ratio;
                    ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);

        // Besturing voor verticale levels (1 en 5): touchpad op mobiel, muis of pijltjes op desktop
        function stuurVerticaal(SPEED) {
            if (isMobile) {
                padVx += (padDelta.x - padVx) * 0.3;
                rocket.angle = Math.max(-20, Math.min(20, padVx * 3.2));
                if (padDelta.x !== 0 || padDelta.y !== 0) {
                    rocket.x = Math.max(0, Math.min(W - 50, rocket.x + padDelta.x));
                    rocket.y = Math.max(0, Math.min(H - 80, rocket.y + padDelta.y));
                    padDelta.x = 0; padDelta.y = 0;
                }
            } else if (touchPos) {
                const dx = touchPos.x - (rocket.x + 2), dy = touchPos.y - (rocket.y + 16);
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 6) {
                    const spd = Math.min(SPEED, dist);
                    rocket.x = Math.max(0, Math.min(W - 50, rocket.x + (dx / dist) * spd));
                    rocket.y = Math.max(0, Math.min(H - 80, rocket.y + (dy / dist) * spd));
                    rocket.angle = Math.max(-20, Math.min(20, dx * 0.18));
                } else { rocket.angle = 0; }
            } else {
                if (keys['ArrowLeft'] && rocket.x > 0) { rocket.x -= SPEED; rocket.angle = -20; }
                else if (keys['ArrowRight'] && rocket.x < W - 50) { rocket.x += SPEED; rocket.angle = 20; }
                else { rocket.angle = 0; }
                if (keys['ArrowUp'] && rocket.y > 0) rocket.y -= SPEED;
                if (keys['ArrowDown'] && rocket.y < H - 80) rocket.y += SPEED;
            }
        }

        // ── LEVEL 1: OPSTIJGEN (FLIGHT) — kopie van RocketManFlight ────
        function updateLevel1() {
            const SPEED = 7;
            if (lvlState === 'waiting') {
                if (keys['Space'] || keys['ArrowUp'] || touchLeft || touchRight) lvlState = 'playing';
                return;
            }
            if (lvlState !== 'playing') return;
            lvlFrames++;

            // Snelheidsopbouw — identiek aan RocketManFlight
            const total = score + coinScore;
            lvlSpeed = 4 + (lvlFrames / 1000) + (total / 2500);
            if (clockBrake > 0) clockBrake = Math.max(0, clockBrake - 0.000055);
            effSpeed = lvlSpeed * (1 - clockBrake);

            // Klok spawnen zodra snelheid hoog genoeg
            if (effSpeed > 7) {
                clockSpawnTimer--;
                if (clockSpawnTimer <= 0) {
                    coins.push({ x: Math.random() * (W - 36), y: -40, type: 'clock', dead: false });
                    clockSpawnTimer = 700 + Math.random() * 500;
                }
            }

            stuurVerticaal(SPEED);

            handleShield();
            rocket.angleDisplay += (rocket.angle - rocket.angleDisplay) * (isMobile ? 0.14 : 0.12);
            spawnFireRaket();

            // Schieten — mitrailleur (houd in)
            if (shootCooldown > 0) shootCooldown--;
            if ((keys['Space'] || touchRight) && shootCooldown === 0 && ammo > 0) {
                bullets.push({ x: rocket.x + 22, y: rocket.y, dead: false });
                ammo--; playShot(); shootCooldown = 30;
            }

        // ── LEVEL 5: VLIEGLES MEISJE (FLIGHT + ZWARTE GATEN) ───────
        // Steeds één zwart gat. Het zakt het scherm in en blijft hangen tot alle munten in zijn baan gepakt zijn,
        // dan sluit het en komt het volgende. Munten zijn er alleen rond het gat (+10). Bij elk volgend gat draait
        // de baan dichter bij de rode ring: dat is de moeilijkheid, niet de snelheid.
        // Binnen de rode ring trekt het gat harder dan de raket kan vliegen; de kern (0,42·r) slokt de raket op.
        let gaten5 = [], gatTimer5 = 0, gatNr5 = 0, slok5 = null, les5 = { gehad: {}, rij: [], tekst: '', timer: 0 };
        const LES_DUUR = 260, SLOK_DUUR = 40;
        // Moeilijkheid. GAT_TREK = trekkracht op straal r; de rode ring ligt waar de trek gelijk is aan de vliegsnelheid (7).

        const GAT_R_MIN = 46, GAT_R_SPREIDING = 16, GAT_TREK = 9.5, GAT_ZONE = 3.5;

        function initLevel5() {
            rocket = { x: W / 2 - 20, y: H - 160, vx: 0, vy: 0, angle: 0, invul: 0, angleDisplay: 0 };
            stars1 = makeStars(60);
            nebulae1 = [
                { x: W * 0.25, y: H * 0.2, r: 130, hue: 300, sp: 0.07 },
                { x: W * 0.8, y: H * 0.5, r: 100, hue: 330, sp: 0.09 },
                { x: W * 0.4, y: H * 0.85, r: 120, hue: 270, sp: 0.06 },
            ];
            setMelody([330, 392, 440, 523, 440, 392, 349, 294], 290);
            setMusicActive(true);
            lvlTimeout = 0;
            lvlSpeed = 0; effSpeed = 0;
            gaten5 = []; gatTimer5 = 60; gatNr5 = 0; slok5 = null;
            les5 = { gehad: {}, rij: [], tekst: '', timer: 0 };
        }
        function geefLes(k) {
            if (les5.gehad[k]) return;
            les5.gehad[k] = true; les5.rij.push(TX('les.' + k));
        }
        function spawnGat5() {
            const r = GAT_R_MIN + Math.random() * GAT_R_SPREIDING;
            const baan = r * GAT_RING * Math.max(BAAN_MIN, BAAN_START - gatNr5 * BAAN_STAP);
            const xMin = baan + 26, xMax = W - baan - 26;
            const x = xMin < xMax ? xMin + Math.random() * (xMax - xMin) : W / 2;
            const g = { x, y: -r * 1.6, r, parkY: Math.max(260, baan + 110), baan, sluit: false, seed: Math.random() * 6, nr: gatNr5 };
            gaten5.push(g);
            const diamant = (gatNr5 + 1) % DIAMANT_ELK === 0;
            for (let k = 0; k < MUNTEN_PER_GAT; k++) coins.push({ type: diamant && k === 0 ? 'blue' : 'gold', bonus: true, gat: g, hoek: k * Math.PI * 2 / MUNTEN_PER_GAT, baan, x: -99, y: -99, dead: false });
            gatNr5++;

        function updateLevel5() {
            const SPEED = 7;
            if (lvlState === 'waiting') {
                if (keys['Space'] || keys['ArrowUp'] || touchLeft || touchRight) { lvlState = 'playing'; geefLes('1'); }
                return;
            }
            if (lvlState !== 'playing') return;
            lvlFrames++;
            if (les5.timer > 0) les5.timer--;
            else if (les5.rij.length) { les5.tekst = les5.rij.shift(); les5.timer = LES_DUUR; }

            if (slok5) {
                slok5.t++;
                rocket.x += (slok5.g.x - 25 - rocket.x) * 0.12;
                rocket.y += (slok5.g.y - 25 - rocket.y) * 0.12;
                if (slok5.t >= SLOK_DUUR) {
                    triggerDeath();
                    particles = []; explosions = []; fireParticles = []; screenShake = 10;
                    popup = { text: '🌀 ' + TX('pop.opgeslokt'), timer: 170, color: '#ff6fb8' };
                }
                return;
            }

            stuurVerticaal(SPEED);

            const rp = { x: rocket.x + 25, y: rocket.y + 25 };
            let trek = 0;
            gaten5.forEach(g => {
                if (g.sluit) g.r *= 0.93;
                else if (g.y < g.parkY) g.y = Math.min(g.parkY, g.y + 2.2);
                const dx = g.x - rp.x, dy = g.y - rp.y, d = Math.hypot(dx, dy) || 1, trekR = g.r * GAT_ZONE;
                if (d < trekR) {

                    rocket.x += dx / d * f; rocket.y += dy / d * f;
                    trek = Math.max(trek, f);
                    if (d < g.r * GAT_RING * 1.4) geefLes('3');

                if (!slok5 && !g.sluit && raketRaakt(g.x, g.y, g.r * 0.42)) {
                    slok5 = { g, t: 0 }; playTone(70, 1.0, 'sawtooth', 0.25);
                }
            });
            rocket.x = Math.max(0, Math.min(W - 50, rocket.x));
            rocket.y = Math.max(0, Math.min(H - 80, rocket.y));
            if (trek > 2.5) geefLes('2');

            handleShield();
            rocket.angleDisplay += (rocket.angle - rocket.angleDisplay) * (isMobile ? 0.14 : 0.12);
            spawnFireRaket();

            coins.forEach(c => {
                if (c.dead || !c.gat) return;
                c.hoek += 0.022;
                c.x = c.gat.x + Math.cos(c.hoek) * c.baan - 18; c.y = c.gat.y + Math.sin(c.hoek) * c.baan - 18;
                if (raketPakt(c.x + 18, c.y + 18, 15)) {

                }
            });
            coins = coins.filter(c => !c.dead);

            gaten5.forEach(g => {
                if (!g.sluit && !coins.some(c => c.gat === g)) {
                    g.sluit = true; playBonus();
                    spawnConfettiBurst(g.x, g.y, ['#ff6fb8', '#c49af0', '#FFD700', '#fff'], 30);
                }
            });
            gaten5 = gaten5.filter(g => g.r > 3);

            if (!gaten5.length) {
                if (--gatTimer5 <= 0) { spawnGat5(); gatTimer5 = 50; }
            }

            nextMilestoneIdx = checkMilestones(score + coinScore, nextMilestoneIdx, popup);

            if (score + coinScore >= DOEL5 && !levelGoalBeaten) {
                levelGoalBeaten = true;
                popup = { text: '⭐ ' + TX('pop.doel'), timer: 160, color: '#FFD700' };
                playBonus();
                geefLes('goed');
            }

            if (goalWasPreviouslyBeaten && !newRecordAnnounced) {
                const prevBest = (getProgress()[currentLevelId] && getProgress()[currentLevelId].best) || 0;
                if (prevBest > 0 && score + coinScore > prevBest) {
                    newRecordAnnounced = true;
                    popup = { text: TX('pop.record'), timer: 200, color: '#FFD700', img: 'highscore' };
                    playRecord();
                }

        }
        function tekenGat5(g, t) {
            const trekR = g.r * GAT_ZONE, ringR = g.r * GAT_RING;
            const z = ctx.createRadialGradient(g.x, g.y, g.r, g.x, g.y, trekR);
            z.addColorStop(0, 'rgba(150,60,255,0.16)'); z.addColorStop(1, 'rgba(150,60,255,0)');
            ctx.fillStyle = z; ctx.beginPath(); ctx.arc(g.x, g.y, trekR, 0, Math.PI * 2); ctx.fill();
            ITEMS.drawItem(ctx, 'black', g.x, g.y, g.r * 2, t, g.seed);
            ctx.save();
            ctx.setLineDash([8, 6]); ctx.lineDashOffset = -t * 20;
            ctx.strokeStyle = 'rgba(60,0,10,0.6)'; ctx.lineWidth = 4.5;
            ctx.beginPath(); ctx.arc(g.x, g.y, ringR, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeStyle = `rgba(255,60,80,${0.75 + 0.25 * Math.sin(t * 4 + g.seed)})`; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.arc(g.x, g.y, ringR, 0, Math.PI * 2); ctx.stroke();

        }
        function tekenLes5() {
            if (les5.timer <= 0 || !les5.tekst) return;

        // ── LEVEL 2: MARS ASTEROIDENVELD (SPACE) ───────────────────
        const GRAVITY = 0.42, BOOST = -7.5;

                    popup = { text: '⚠️ ' + TX(mb.label), timer: 120, color: mb.color };
                    playTone(150, 0.7, 'sawtooth', 0.3);
                    comets = [];
                }
            }

            // Boss update (mama + mini)
            if (boss && !boss.dead) {
                boss.angle += 0.04;
                const bRx = 180 + Math.sin(boss.angle * 0.3) * 40;
                const bRy = 100 + Math.sin(boss.angle * 0.17) * 50;
                boss.x = W * 0.55 + Math.cos(boss.angle * 0.7) * bRx;
                boss.y = H * 0.5  + Math.sin(boss.angle * 1.1) * bRy + Math.sin(boss.angle * 0.4) * 40;
                if (rocket.invul <= 0 && raketRaaktBoss(boss)) triggerDeath();
                bullets.forEach(b => {
                    if (!boss || b.dead) return;
                    if (Math.abs(b.x - boss.x) < 90 && Math.abs(b.y - boss.y) < 90) {
                        b.dead = true; boss.hp--; bossHP--;
                        spawnExplosion(boss.x + (Math.random() - 0.5) * 50, boss.y + (Math.random() - 0.5) * 50, Math.random() * 360);
                        playExplosion();
                        if (boss.hp <= 0) {
                            if (boss.isMini) {
                                miniBossWave++;
                                coinScore += 25;
                                popup = { text: '💥 ' + TX('pop.bonus'), timer: 150, color: boss.color };
                                spawnConfettiBurst(boss.x, boss.y, [boss.color, '#fff', '#FFD700'], 40);
                            } else {
                                bossDefeated = true;
                                levelGoalBeaten = true;
                                saveGoalBeaten(currentLevelId);
                                if (levelDef(currentLevelId + 1)) unlockLevel(currentLevelId + 1);
                                popup = { text: '⭐ ' + TX('pop.mamaVrij'), timer: 180, color: '#FFD700' };
                            }
                            boss.dead = true; boss = null;
                            playBonus();
                        }
                    }
                });
            }

            // Cleanup
            comets = comets.filter(c => c.x > -200 && !c.dead);
            coins = coins.filter(c => c.x > -100 && !c.dead);
            bullets = bullets.filter(b => !b.dead);

            const t2 = score + coinScore;
            nextMilestoneIdx = checkMilestones(t2, nextMilestoneIdx, popup);
        }

        function drawBoss(t) {
            if (!boss || boss.dead) return;
            const flash = boss.hp < boss.maxHp ? 0.5 + Math.sin(frameCount * 0.5) * 0.5 : 1, rgb = hexRgb(boss.color || '#ff4444');
            zachteGloed(boss.x, boss.y, 105, rgb, 0.42 * flash + 0.12);
            ctx.save(); ctx.globalAlpha = 0.55 + 0.45 * flash;
            const bSheet = boss.sheet || 'mama_komeet_spritesheet', bCfg = ANIM_CONFIGS[bSheet];
            if (bCfg && bCfg.cols && imageStatus[bSheet]) {
                const fi = Math.floor(frameCount / Math.max(1, Math.round(60 / bCfg.fps))) % bCfg.frames;
                drawAnimFrame(bSheet, fi, boss.x - 65, boss.y - 65, 130, 130);
            } else { ctx.fillStyle = boss.color || '#ff4444'; ctx.beginPath(); ctx.arc(boss.x, boss.y, 60, 0, Math.PI * 2); ctx.fill(); }
            ctx.restore();
            drawBalk(W / 2, H - 30, 160, 14, bossHP / bossMaxHP, boss.color || '#ff4444', boss.label ? TX(boss.label) : TX('balk.mamaBoss'));
        }

        function drawLevel2() {
            const tG = frameCount / 60;
            GFX.drawLucht(ctx, W, H, tG, 2);
            GFX.drawNevels(ctx, nebulae2, W, H, 'h', tG);
            GFX.drawSterren(ctx, stars2, tG, W, H, 'h', 0.75);
            GFX.drawMars(ctx, W - 2 + Math.cos(frameCount * 0.004) * 4, 60, 64, tG);

            drawComets(comets);
            drawBoss(tG);
            coins.forEach(c => { if (!c.dead) drawCoin(c); });
            drawBullets(false);
            drawParticles();
            drawFire();
            if (gameMode !== 'dying') drawSpelerRaket(tG);
            drawHUD(score + coinScore, ammo, rocket.invul, popup);

            if (!boss && !levelGoalBeaten) drawBalk(W / 2, H - 30, 200, 14, (score + coinScore) / 75, '#4aff8a', TX('balk.doelBoss'));

            if (lvlState === 'waiting') drawWaitingHint('space');
        }

        // ── LEVEL 3: SATURNUSRINGEN (SPACE + RINGEN) ───────────────
        function updateLevel3() {
            if (lvlState === 'waiting') {
                rocket.y = (H / 2 - 20) + Math.sin(frameCount * 0.05) * 15;
                ruimteHouding(); spawnFireRaket();
                if (keys['Space'] || touchLeft) lvlState = 'playing';
                return;
            }
            if (lvlState !== 'playing') return;
            lvlFrames++;

            // Gravity (stronger)
            const GRAV3 = 0.52;
            rocket.vy += GRAV3;
            rocket.y += rocket.vy;
            rocket.angle = Math.max(-20, Math.min(35, rocket.vy * 3));
            if (rocket.y < 0 || rocket.y > H - 10) { triggerDeath(); return; }

            if (keys['Space'] || keys['ArrowUp'] || touchLeft) rocket.vy = BOOST;

            handleShield();
            if (shootCooldown > 0) shootCooldown--;
            if ((keys['ArrowRight'] || touchRight) && shootCooldown === 0 && ammo > 0) {
                bullets.push({ x: rocket.x + 60, y: rocket.y + 15, dead: false });
                ammo--; playShot(); shootCooldown = 30;
            }

            ruimteHouding();
            spawnFireRaket();

            const total = score + coinScore;
            lvlSpeed = 3.2 + (lvlFrames / 1100) + (total / 3000);
            effSpeed = lvlSpeed * (1 - clockBrake);
            if (clockBrake > 0) clockBrake = Math.max(0, clockBrake - 0.00006);

            if (blackHoleTimer3 > 0) blackHoleTimer3--;

            // Rings move
            rings.forEach(r => {
                r.x -= effSpeed;
                if (!r.scored && r.x + 20 < rocket.x) {
                    r.scored = true; score += 3;
                    playTone(700, 0.15, 'sine', 0.08);
                    spawnConfettiBurst(rocket.x, rocket.y, ['#d4a853', '#fff', '#FFD700'], 10);
                }
                // Collision uitgeschakeld tijdens void
                if (blackHoleTimer3 > 0) return;
                if (rocket.invul <= 0 && raketRaaktRing(r)) triggerDeath();
            });

            // Recycle rings
            const lastRing = rings[rings.length - 1];
            if (rings[0].x < -60) {
                const newX = Math.max(lastRing.x + 350, W + 100);
                const newGapH = Math.max(130, 170 - lvlFrames / 300);
                const newGapY = 120 + Math.random() * (H - newGapH - 200);
                rings.push({
                    x: newX, gapY: newGapY, gapH: newGapH, scored: false, holes: [],
                    topRocks: createRockColumn(0, newGapY),
                    botRocks: createRockColumn(newGapY + newGapH, H)
                });
                rings.shift();
            }

            // Spawn neef comets between rings — alleen als speler munitie heeft
            if (ammo > 0 && lvlFrames % 90 === 0 && Math.random() < 0.6) {
                comets.push({ x: W + 150, y: 50 + Math.random() * (H - 200), t: { n: 'neef', c: 3, sheet: 'neef_komeet_spritesheet' }, s: false, hue: Math.floor(Math.random() * 360), dead: false });
            }

            // Spawn coins
            if (lvlFrames % 130 === 0) {
                let r2 = Math.random(), type = 'gold';
                if (r2 < 0.05) type = 'black'; else if (r2 < 0.13) type = 'green';
                else if (r2 < 0.26) type = 'blue'; else if (r2 < 0.58) type = 'ammo';
                const rr = rings[Math.floor(Math.random() * rings.length)];
                const cy3 = rr ? rr.gapY + 20 + Math.random() * Math.max(0, rr.gapH - 40) : 100 + Math.random() * (H - 200);
                coins.push({ x: W + 50, y: cy3, type, dead: false });
            }

            comets.forEach(c => {
                c.x -= effSpeed;
                if (!c.s && !c.dead && c.x < rocket.x) { c.s = true; score++; }
                if (!c.dead && rocket.invul <= 0 && raketRaaktKomeet(c)) triggerDeath();
            });

            coins.forEach(c => { if (c.dead) return; c.x -= effSpeed; if (rectHit(rocket.x + 5, rocket.y + 5, 50, 30, c.x, c.y, 36, 36)) collectCoin(c); });

            bullets.forEach(b => {
                b.x += 12; if (b.x > W + 20) b.dead = true;
                comets.forEach(c => { if (!c.dead && !b.dead && b.x > c.x && b.x < c.x + 100 && b.y > c.y && b.y < c.y + 100) { c.dead = true; b.dead = true; coinScore += 10; spawnExplosion(c.x + 50, c.y + 50, c.hue); playExplosion(); } });
                if (!b.dead) {
                    rings.forEach(r => {
                        if (b.dead) return;
                        if (b.x < r.x - 5 || b.x > r.x + 43) return;
                        // Controleer of kogel in wand zit (niet in het gat)
                        const inWall = b.y < r.gapY || b.y > r.gapY + r.gapH;
                        if (!inWall) return;
                        // Controleer of er al een gat is op deze positie
                        const inHole = r.holes.some(h => Math.abs(b.y - h.y) < h.r);
                        if (inHole) return;
                        // Blaas een gat
                        r.holes.push({ y: b.y, r: 64, t0: frameCount });
                        b.dead = true;
                        screenShake = Math.min(screenShake + 3, 8);
                        playExplosion();
                        // Kleine explosie — goudkleurige ring-deeltjes
                        for (let i = 0; i < 14; i++) {
                            const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 3.5;
                            const hue = 38 + Math.random() * 20;
                            particles.push({ x: r.x + 19 + (Math.random() - 0.5) * 20, y: b.y + (Math.random() - 0.5) * 20, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, c: `hsl(${hue},80%,65%)`, s: 3 + Math.random() * 4, decay: 0.03 + Math.random() * 0.025 });
                        }
                        spawnExplosion(r.x + 19, b.y, 42);
                    });
                }
            });

            comets = comets.filter(c => c.x > -200 && !c.dead);
            coins = coins.filter(c => c.x > -100 && !c.dead);
            bullets = bullets.filter(b => !b.dead);

            const t3 = score + coinScore;
            nextMilestoneIdx = checkMilestones(t3, nextMilestoneIdx, popup);

            if (t3 >= 100 && !levelGoalBeaten) {
                levelGoalBeaten = true;
                popup = { text: '⭐ ' + TX('pop.doel'), timer: 160, color: '#FFD700' };
                playBonus();
            }
        }

        // Ringwand: stofband van de ring, belichte ijs- en rotsbrokken, gaten met gloeiende rand die afkoelt
        function drawRingWand(r, t) {
            const cx = r.x + 19;
            const deel = (y0, y1, rocks) => {
                if (y1 - y0 < 1) return;
                const holes = r.holes.filter(h => h.y + h.r > y0 && h.y - h.r < y1);
                ctx.save();
                ctx.beginPath(); ctx.rect(r.x - 40, holes.length ? 0 : y0 - 40, 118, holes.length ? H : y1 - y0 + 80);
                holes.forEach(h => { ctx.moveTo(cx + h.r, h.y); ctx.arc(cx, h.y, h.r, 0, Math.PI * 2, true); });
                ctx.clip('evenodd');
                rocks.forEach(rock => {
                    if (holes.some(h => Math.abs(rock.y - h.y) < h.r - rock.size * 0.25)) return;
                    GFX.drawSteen(ctx, cx + rock.dx, rock.y, rock.size * 0.62, rock.icy, Math.floor(rock.seed));
                });
                ctx.save(); ctx.globalCompositeOperation = 'lighter';
                rocks.forEach((rock, i) => {
                    if (!rock.icy || i % 2) return;
                    const tw = Math.pow(Math.max(0, Math.sin(t * 2.3 + rock.seed)), 14);
                    if (tw < 0.05) return;
                    const gx = cx + rock.dx - rock.size * 0.22, gy = rock.y - rock.size * 0.25, L = 6 * tw;
                    ctx.strokeStyle = `rgba(230,250,255,${tw})`; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(gx - L, gy); ctx.lineTo(gx + L, gy); ctx.moveTo(gx, gy - L); ctx.lineTo(gx, gy + L); ctx.stroke();
                });
                ctx.restore();
                ctx.restore();
                if (holes.length) {
                    ctx.save(); ctx.beginPath(); ctx.rect(r.x - 40, y0, 118, y1 - y0); ctx.clip();
                    ctx.globalCompositeOperation = 'lighter';
                    holes.forEach(h => {
                        const k = Math.max(0.22, 1 - (frameCount - (h.t0 || 0)) / 90);
                        ctx.strokeStyle = `rgba(255,150,60,${0.18 * k})`; ctx.lineWidth = 9;
                        ctx.beginPath(); ctx.arc(cx, h.y, h.r, 0, Math.PI * 2); ctx.stroke();
                        ctx.strokeStyle = `rgba(255,210,140,${0.7 * k})`; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(cx, h.y, h.r, 0, Math.PI * 2); ctx.stroke();
                    });
                    ctx.restore();
                }
            };
            deel(0, r.gapY, r.topRocks);
            deel(r.gapY + r.gapH, H, r.botRocks);
        }

        function drawLevel3() {
            const tG = frameCount / 60;
            GFX.drawLucht(ctx, W, H, tG, 3);

            if (blackHoleTimer3 > 0) {
                const t = blackHoleTimer3 / 220;
                const darkness = t > 0.7 ? (1 - t) / 0.3 : t < 0.2 ? t / 0.2 : 1;
                ctx.fillStyle = `rgba(0,0,0,${darkness * 0.97})`; ctx.fillRect(0, 0, W, H);
                if (darkness > 0.05) {
                    const pulse = 0.7 + Math.sin(frameCount * 0.18) * 0.3;
                    ctx.save(); ctx.globalAlpha = Math.min(1, darkness * 1.4);
                    ITEMS.drawItem(ctx, 'black', W / 2, H / 2, 190 + pulse * 40, tG, 0);
                    ctx.restore();
                }
                drawParticles();
                drawFire();
                if (gameMode !== 'dying') drawSpelerRaket(tG);
                drawHUD(score + coinScore, ammo, rocket.invul, popup);
                return;
            }

            GFX.drawNevels(ctx, nebulae2, W, H, 'h', tG);
            GFX.drawSterren(ctx, stars2, tG, W, H, 'h', 1);
            GFX.drawSaturnus(ctx, W - 10 + Math.cos(frameCount * 0.003) * 3, 76, 44, tG);

            rings.forEach(r => { if (r.x > -80 && r.x < W + 80) drawRingWand(r, tG); });

            drawComets(comets);
            coins.forEach(c => { if (!c.dead) drawCoin(c); });
            drawBullets(false);
            drawParticles();
            drawFire();
            if (gameMode !== 'dying') drawSpelerRaket(tG);
            drawHUD(score + coinScore, ammo, rocket.invul, popup);

            if (!levelGoalBeaten) drawBalk(W / 2, H - 30, 200, 14, (score + coinScore) / 100, '#d4a853', TX('balk.doel', { n: 100 }));

            if (lvlState === 'waiting') drawWaitingHint('space');
        }

        // ── LEVEL 4: RUÏNES (FLIGHT + LASERS) ──────────────────────
        function updateLevel4() {
            const SPEED = 7;
            const total4 = score + coinScore;
            lvlSpeed = 1.8 + (lvlElapsed / 1000) + (total4 / 3000);
            if (clockBrake > 0) clockBrake = Math.max(0, clockBrake - 0.00006);
            effSpeed = lvlSpeed * (1 - clockBrake);
            if (lvlState === 'waiting') {
                if (keys['Space'] || keys['ArrowUp'] || touchLeft || touchRight) lvlState = 'playing';
                return;
            }
            if (lvlState !== 'playing') return;
            lvlElapsed++;

            // Input — Vrije besturing
            if (isMobile) {
                padVx += (padDelta.x - padVx) * 0.3;
                rocket.angle = Math.max(-20, Math.min(20, padVx * 3.2));
                if (padDelta.x !== 0 || padDelta.y !== 0) {
                    rocket.x = Math.max(0, Math.min(W - 50, rocket.x + padDelta.x));
                    rocket.y = Math.max(0, Math.min(H - 80, rocket.y + padDelta.y));
                    padDelta.x = 0; padDelta.y = 0;
                }
            } else if (touchPos) {
                const dx = touchPos.x - (rocket.x + 25), dy = touchPos.y - (rocket.y + 25);
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 6) {
                    const spd = Math.min(SPEED, dist);
                    rocket.x += (dx / dist) * spd;
                    rocket.y += (dy / dist) * spd;
                    rocket.angle = Math.max(-20, Math.min(20, dx * 0.18));
                } else { rocket.angle = 0; }
            } else {
                if (keys['ArrowLeft']) { rocket.x -= SPEED; rocket.angle = -20; }
                else if (keys['ArrowRight']) { rocket.x += SPEED; rocket.angle = 20; }
                else { rocket.angle = 0; }
                if (keys['ArrowUp']) rocket.y -= SPEED;
                if (keys['ArrowDown']) rocket.y += SPEED;
            }

            rocket.angleDisplay += (rocket.angle - rocket.angleDisplay) * (isMobile ? 0.14 : 0.12);

            if (rocket.x < -10 || rocket.x > W - 40 || rocket.y < -10 || rocket.y > H - 70) {
                triggerDeath();
                return;
            }

            handleShield();

            // Shooting (upward)
            if (shootCooldown > 0) shootCooldown--;
            if ((keys['Space'] || touchRight) && shootCooldown === 0 && ammo > 0) {
                bullets.push({ x: rocket.x + 22, y: rocket.y, dy: -10, dead: false });
                ammo--; playShot(); shootCooldown = 30;
            }

            spawnFireRaket();

            // Laser update — 1 tegelijk, eerst waarschuwing dan dodelijk
            laserTimer++;
            if (laserTimer >= LASER_CYCLE) {
                laserTimer = 0;
                laserIdx = (laserIdx + 1) % lasers.length;
            }
            laserPhase = laserTimer < LASER_WARN ? 'warn' : laserTimer < LASER_WARN + LASER_FIRE ? 'fire' : 'cool';
            if (laserPhase === 'warn' && laserTimer === 1) playLaser();
            if (laserPhase === 'fire' && rocket.invul <= 0) {
                const l = lasers[laserIdx];
                if (raketRaaktStrook(l.x - 10, l.x + 10)) triggerDeath();
            }

            // Kometen van ONDEREN (tegengesteld)
            if (lvlElapsed % 75 === 0) {
                comets.push({ x: Math.random() * (W - 100), y: H + 50, t: { n: 'zoon', c: 3, sheet: 'zoon_bozekomeet_spritesheet' }, hue: Math.floor(Math.random() * 360), dy: -2.5, dead: false, s: false });
            }
            comets.forEach(c => {
                c.y -= effSpeed;
                if (!c.dead && rocket.invul <= 0 && raketRaaktKomeet(c)) triggerDeath();
                if (c.y < -120) c.dead = true;
            });

            // Bullets (upward)
            bullets.forEach(b => {
                b.y += (b.dy || -10); if (b.y < -20) b.dead = true;
                comets.forEach(c => { if (!c.dead && !b.dead && Math.abs(b.x - c.x - 50) < 50 && Math.abs(b.y - c.y - 50) < 50) { c.dead = true; b.dead = true; coinScore += 10; spawnExplosion(c.x + 50, c.y + 50, c.hue); playExplosion(); } });
                coins.forEach(c => { if (c.type === 'clock' && !c.dead && !b.dead && Math.abs(b.x - c.x) < 36 && Math.abs(b.y - c.y) < 36) { c.dead = true; b.dead = true; applyClockBrake(); } });
            });

            // Key fragments scroll down
            keyFragments.forEach(kf => {
                kf.y += 1.5;
                if (!kf.collected && rectHit(rocket.x + 5, rocket.y + 5, 40, 30, kf.x, kf.y, 36, 36)) {
                    kf.collected = true;
                    spawnConfettiBurst(kf.x + 18, kf.y + 18, ['#FFD700', '#FFF8DC', '#DAA520'], 20);
                    playAmmo();
                    const got = keyFragments.filter(k => k.collected).length;
                    popup = { text: '🔑 ' + TX('pop.sleutel', { n: got }), timer: 80, color: '#FFD700' };
                }
                if (!kf.collected && kf.y > H + 50) {
                    kf.y = -100;
                    kf.x = 80 + Math.random() * (W - 120);
                }
            });

            // Spawn coins: minder ammo, meer klokjes naarmate je langer speelt
            if (lvlElapsed % 220 === 0) {
                coins.push({ x: Math.random() * (W - 36), y: -40, dy: 2, type: 'ammo', dead: false });
            }
            if (lvlElapsed % 150 === 0 && Math.random() < 0.35) {
                coins.push({ x: Math.random() * (W - 36), y: -40, dy: 1.8, type: 'blue', dead: false });
            }
            // Klokjes: verschijnen zodra het snel genoeg is
            if (effSpeed > 3.5) {
                clockSpawnTimer--;
                if (clockSpawnTimer <= 0) {
                    coins.push({ x: Math.random() * (W - 36), y: -40, dy: 2, type: 'clock', dead: false });
                    clockSpawnTimer = Math.max(80, 400 - Math.floor(effSpeed * 30));
                }
            }
            coins.forEach(c => {
                if (c.dead) return;
                c.y += Math.min(c.dy * (effSpeed / 2.5), effSpeed * 0.6);
                if (rectHit(rocket.x + 5, rocket.y + 5, 40, 30, c.x, c.y, 36, 36)) {
                    if (c.type === 'ammo') { ammo += 10; playAmmo(); popup = { text: '🔫 ' + TX('pop.kogels'), timer: 80, color: '#FFD700' }; }
                    else if (c.type === 'blue') { const t = score + coinScore; coinScore = t * 2; score = 0; playBonus(); popup = { text: '💎 ' + TX('pop.dubbel'), timer: 130, color: '#a78bfa' }; spawnConfettiBurst(c.x + 18, c.y + 18, ['#a78bfa', '#e879f9', '#fff'], 35); }
                    else if (c.type === 'clock') { applyClockBrake(); }
                    c.dead = true;
                }
            });

            comets = comets.filter(c => !c.dead && c.y > -150);
            coins = coins.filter(c => !c.dead && c.y < H + 50);
            bullets = bullets.filter(b => !b.dead);

            // Win: 3 keys AND 150 points within 45s
            const keysGot = keyFragments.filter(k => k.collected).length;
            if (keysGot >= 3 && (score + coinScore) >= 150 && !levelGoalBeaten) {
                levelGoalBeaten = true;
                popup = { text: '🎯 ' + TX('pop.doel'), timer: 160, color: '#FFD700' };
                playBonus();
            }

        }

        // Ruïnes: zwevende eilandjes met zuil, boog of blokken en gloeiende runen; één keer getekend naar een eigen canvas
        function maakRuine(type, s, seed) {
            let st = seed * 9301 + 49297;
            const rnd = () => { st = (st * 9301 + 49297) % 233280; return st / 233280; };
            const DPR = Math.min(2, window.devicePixelRatio || 1);
            const w = 90 * s, hb = 52 * s, topH = (type === 'zuil' ? 135 : type === 'boog' ? 112 : 72) * s;
            const cw = Math.ceil(w * 1.5), ch = Math.ceil(topH + hb + 24 * s), ox = cw / 2, oy = topH + 12 * s;
            const cnv = document.createElement('canvas'); cnv.width = Math.ceil(cw * DPR); cnv.height = Math.ceil(ch * DPR);
            const c = cnv.getContext('2d'); c.scale(DPR, DPR); c.translate(ox, oy); c.lineJoin = 'round';
            const steen = (x0, y0, x1, y1) => {
                const g = c.createLinearGradient(x0, y0, x1, y1);
                g.addColorStop(0, '#a6c8de'); g.addColorStop(0.3, '#6488a8'); g.addColorStop(0.7, '#2a4c70'); g.addColorStop(1, '#10264a');
                return g;
            };
            const cil = (x0, x1) => {
                const g = c.createLinearGradient(x0, 0, x1, 0);

                if (gameMode === 'playing') {
                    huidigLevel().update();
                    if (gameMode === 'playing' && rocket.invul <= 0) coins.forEach(c => { if (!c.dead && c.type === 'red' && raketRaakt(c.x + 18, c.y + 18, 16)) { c.dead = true; triggerDeath(); } });
                    updateParticles();
                } else if (gameMode === 'dying') {
                    deathTimer--;
                    deathFlash = Math.max(0, deathFlash - 0.018);
                    updateParticles();
                    if (deathTimer <= 0) {
                        const total = score + coinScore;
                        const prevBest = (getProgress()[currentLevelId] && getProgress()[currentLevelId].best) || 0;
                        saveBestScore(currentLevelId, total);
                        if (levelGoalBeaten && !goalWasPreviouslyBeaten) {
                            // First time completing this level → fanfare, naam, cutscene, unlock
                            showLevelCompleteSequence(prevBest);
                        } else {
                            // Game over (never beat goal, or high score mode replay)
                            gameMode = 'gameOver';
                            lvlState = 'dead';
                            setMusicActive(false);
                            showNameInputOverlay(total, (name) => {
                                saveScore(currentLevelId, name, total);
                            }, prevBest);
                        }
                    }
                } else if (gameMode === 'levelComplete') {
                    lvlCompleteTimer++;
                    updateParticles();
                }

                // Draw
                huidigLevel().teken();

                // Death flash
                if (deathFlash > 0) { ctx.fillStyle = `rgba(255,30,0,${deathFlash * 0.55})`; ctx.fillRect(0, 0, W, H); }

                // Level complete overlay (brief)
                if (gameMode === 'levelComplete' && lvlCompleteTimer < 80) {
                    const a = Math.min(1, lvlCompleteTimer / 20);
                    ctx.globalAlpha = a; ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0, 0, W, H);
                    zachteGloed(W / 2, H / 2 - 15, 220, '255,200,60', 0.35, 0.35);
                    ctx.textAlign = 'center';
                    randTekst(TX('voltooid'), W / 2, H / 2, 'bold 44px sans-serif', goudVerloop(H / 2 - 36, H / 2 + 4), 7);
                    ctx.globalAlpha = 1;
                }
            } else if (gameMode === 'cutscene') {
                drawCutscene();
            } else if (gameMode === 'levelIntro') {
                drawLevelIntro();
            } else if (gameMode === 'gameOver') {
                updateParticles();
                drawGameOver();
                drawParticles();
            }

            ctx.restore();
            if (dbg.aan) drawDbg();
            requestAnimationFrame(gameLoop);
        }
        function drawDbg() {
            const fps = dbg.stamps.length, nps = dbg.noten - (dbg.notenStamps[0] || 0);
            const r = [
                `beelden/s ${fps}   lussen ${dbg.lussen}`,
                `level ${currentLevelId}  ${gameMode}/${lvlState}`,
                `lvlSpeed ${lvlSpeed.toFixed(2)}  effSpeed ${effSpeed.toFixed(2)}`,
                `klokrem ${clockBrake.toFixed(2)}  lvlElapsed ${lvlElapsed}`,
                `muziek ${musicIntervalTempo} ms  timers ${dbg.timers}  noten/s ${nps}`,
                `kometen ${comets.filter(c => !c.dead).length}  score ${score + coinScore}`
            ];
            if (gameMode === 'playing' || gameMode === 'dying') {
                ctx.save(); ctx.lineWidth = 1;
                const cirkel = (x, y, rr, col) => { ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(x, y, Math.max(0.5, rr), 0, Math.PI * 2); ctx.stroke(); };
                raketCirkels().forEach(c => cirkel(c.x, c.y, c.r - SPELING, '#40ffe0'));
                comets.forEach(c => { if (!c.dead) { const [x, y, rr] = komeetCirkel(c.t.sheet, c.x, c.y, 100); cirkel(x, y, rr, '#ff5050'); } });
                if (boss && !boss.dead) { const [x, y, rr] = komeetCirkel(boss.sheet || 'mama_komeet_spritesheet', boss.x - 65, boss.y - 65, 130); cirkel(x, y, rr, '#ff5050'); }
                if (currentLevelId === 1) birds.forEach(b => cirkel(b.x + 15, b.y + 16, 15, '#ff5050'));
                coins.forEach(c => { if (!c.dead && c.type === 'red') cirkel(c.x + 18, c.y + 18, 16, '#ff5050'); });
                if (currentLevelId === 3) rings.forEach(rg => { if (rg.x < -80 || rg.x > W + 80) return; rg.topRocks.concat(rg.botRocks).forEach(k => { if (!steenVerstopt(rg, k)) cirkel(rg.x + 19 + k.dx, k.y, k.size * 0.62, '#ff9050'); }); });
                if (currentLevelId === 5) {
                    const p = raketPose(), s = p.h / 100, a = p.a * Math.PI / 180, ux = Math.sin(a), uy = -Math.cos(a);
                    ctx.strokeStyle = '#ffe060'; ctx.lineWidth = PAK_BREEDTE * s * 2; ctx.globalAlpha = 0.25; ctx.lineCap = 'round';
                    ctx.beginPath(); ctx.moveTo(p.x + ux * PAK_ACHTER * s, p.y + uy * PAK_ACHTER * s); ctx.lineTo(p.x + ux * PAK_VOOR * s, p.y + uy * PAK_VOOR * s); ctx.stroke();
                    ctx.globalAlpha = 1; ctx.lineWidth = 1;
                }
                if (currentLevelId === 5) gaten5.forEach(g => { cirkel(g.x, g.y, g.r * 0.42, '#ff5050'); cirkel(g.x, g.y, g.r * GAT_RING, '#ffb050'); cirkel(g.x, g.y, g.r * GAT_ZONE, '#b080ff'); cirkel(g.x, g.y, g.baan, '#ffe060'); });
                if (currentLevelId === 4 && laserPhase === 'fire') { const l = lasers[laserIdx]; ctx.strokeStyle = '#ff5050'; ctx.strokeRect(l.x - 10, 0, 20, H); }
                ctx.restore();
            }
            ctx.save(); ctx.font = '12px monospace'; ctx.textAlign = 'left';
            ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(6, 80, 290, r.length * 15 + 8);
            ctx.fillStyle = (fps > 70 || dbg.timers > 1) ? '#ff6060' : '#7fffb0';
            r.forEach((t, i) => ctx.fillText(t, 12, 96 + i * 15));
            ctx.restore();
        }

        function drawLoading() {
            ctx.fillStyle = '#080f30'; ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#40E0D0'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(TX('laden'), W / 2, H / 2);
        }

        // ── Boot ───────────────────────────────────────────────────
        unlockLevel(1);
        if (hasBeatenGoal(4)) unlockLevel(5);
        kiesHoofdstuk();
        function cutsceneVoor(id) {
            const def = levelDef(id), f = def && def.familie, pl = def && def.piloot;
            if (pl) return { headline: TX('cs' + id + '.kop') + ' ' + pl.emoji, sprite: pl.n + '_bevrijd_spritesheet', emoji: pl.emoji, rescued: TX('cs' + id + '.zegt'), buff: TX('cs' + id + '.buff'), frames: pl.frames.length, frameLijst: pl.frames, cols: 3, rows: 2, fps: 3 };
            if (!f) return { headline: TX('voltooid'), emoji: '🎉', rescued: '', buff: '' };
            return { headline: TX('cs' + id + '.kop') + ' ' + f.emoji, sprite: f.n + '_bevrijd_spritesheet', emoji: f.emoji, rescued: TX('cs' + id + '.zegt'), buff: TX('cs' + id + '.buff'), frames: 6, cols: 3, rows: 2, fps: 8 };
        }
        loadImages(() => {
            const params = new URLSearchParams(location.search);
            const pv = parseInt(params.get('preview'));
            const pl = parseInt(params.get('play'));
            if (levelDef(pv)) {
                currentLevelId = pv;
                showCutscene(cutsceneVoor(pv));
            } else if (levelDef(pl)) {
                devUnlocked = true;
                initAudio();
                const startScore = parseInt(params.get('score')) || 0;
                const startTime  = parseInt(params.get('time'))  || 0;
                window._devStartScore = startScore;
                window._devStartTime  = startTime;
                selectLevel(pl, true);
            } else {
                gameMode = 'menu'; setMusicActive(true);
            }
        });
        gameLoop();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
